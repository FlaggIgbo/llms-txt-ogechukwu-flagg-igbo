version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: llmstxt-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: llmstxt_directory
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../packages/database/migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro

  redis:
    image: redis:7-alpine
    container_name: llmstxt-redis
    ports:
      - "6379:6379"

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: llmstxt-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"

  localstack:
    image: localstack/localstack:3.7
    container_name: llmstxt-localstack
    environment:
      - SERVICES=s3,sqs
      - DEFAULT_REGION=us-east-1
    ports:
      - "4566:4566"

volumes:
  postgres_data:
