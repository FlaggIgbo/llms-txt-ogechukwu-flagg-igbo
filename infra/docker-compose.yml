version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: llmstxt-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: llmstxt_directory
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../packages/database/migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro

  redis:
    image: redis:7-alpine
    container_name: llmstxt-redis
    ports:
      - "6379:6379"

volumes:
  postgres_data:
