services:
  postgres:
    image: postgres:16-alpine
    container_name: llmstxt-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: llmstxt_directory
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../packages/database/migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro

  # MinIO local S3/R2-compatible object storage cluster for development
  minio:
    image: minio/minio:latest
    container_name: llmstxt-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 / R2 API endpoint
      - "9001:9001"   # MinIO Web Console
    volumes:
      - minio_data:/data

  # Automatic bucket initialization and public download policy setup
  minio-init:
    image: minio/mc:latest
    container_name: llmstxt-minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 2;
      /usr/bin/mc alias set local http://minio:9000 minioadmin minioadmin;
      /usr/bin/mc mb --ignore-existing local/llmstxt-files-bucket;
      /usr/bin/mc anonymous set download local/llmstxt-files-bucket;
      exit 0;
      "

volumes:
  postgres_data:
  minio_data:
