databases:
  - name: llmstxt-postgres
    databaseName: llmstxt_directory
    plan: free

services:
  # 1. Frontend Web App (React / Vite Static Site)
  # Note: Static sites on Render are served via global CDN and do not specify a 'plan'
  - type: web
    name: llmstxt-web
    env: static
    buildCommand: npm install && npm run build --workspace=@llmstxt/web
    staticPublishPath: apps/web/dist
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: llmstxt-api
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # 2. Backend HTTP API Gateway
  - type: web
    name: llmstxt-api
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npx tsx apps/api/src/index.ts
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: llmstxt-postgres
          property: connectionString
      - key: STORAGE_PROVIDER
        value: local
      - key: LOCAL_STORAGE_DIR
        value: /tmp/storage

  # 3. Scraping, LLMs.txt Generation & Cadence Worker
  - type: worker
    name: llmstxt-worker
    env: node
    plan: starter
    buildCommand: npm install && npx playwright install --with-deps chromium
    startCommand: npx tsx apps/worker/src/index.ts
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: llmstxt-postgres
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: STORAGE_PROVIDER
        value: local
      - key: LOCAL_STORAGE_DIR
        value: /tmp/storage
