databases:
  - name: llmstxt-postgres
    databaseName: llmstxt_directory
    plan: free

services:
  # 1. Frontend Web App (React / Vite Static Site)
  # Note: Static sites on Render are served via global CDN and do not specify a 'plan'
  - type: web
    name: llmstxt-web
    env: static
    buildCommand: npm install && npm run build --workspace=@llmstxt/web
    staticPublishPath: apps/web/dist
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: llmstxt-api
          property: host
      - key: VITE_SENTRY_DSN
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # 2. Backend HTTP API Gateway
  - type: web
    name: llmstxt-api
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npx tsx apps/api/src/index.ts
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: llmstxt-postgres
          property: connectionString
      - key: STORAGE_PROVIDER
        value: r2
      - key: R2_LLMS_TXT_BUCKET
        value: llmstxt-files-bucket
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: R2_PUBLIC_URL
        sync: false
      - key: SENTRY_DSN
        sync: false

  # 3. Scraping, LLMs.txt Generation & Cadence Worker (Docker container with pre-installed Chromium)
  - type: worker
    name: llmstxt-worker
    runtime: docker
    plan: starter
    dockerfilePath: ./apps/worker/Dockerfile
    dockerContext: .
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: llmstxt-postgres
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: STORAGE_PROVIDER
        value: r2
      - key: LOCAL_STORAGE_DIR
        value: /tmp/storage
      - key: R2_LLMS_TXT_BUCKET
        value: llmstxt-files-bucket
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false

  # 4. Scheduled Cadence Updater Service
  - type: worker
    name: llmstxt-cron-updater
    env: node
    plan: starter
    buildCommand: npm install
    startCommand: npx tsx apps/cron-updater/src/index.ts
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: llmstxt-postgres
          property: connectionString
      - key: SENTRY_DSN
        sync: false
